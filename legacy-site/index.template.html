<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ZUTOMAYO Gallery · Site Moved</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #0a0a0a;
      color: #f7f7f7;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        #0a0a0a;
      background-size: 100% 4px;
    }
    main {
      width: min(720px, 100%);
      border: 2px solid #f7f7f7;
      box-shadow: 10px 10px 0 #ff365d;
      padding: clamp(28px, 6vw, 56px);
      background: #111;
    }
    .status {
      margin: 0 0 22px;
      color: #71f7b0;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 4.5rem);
      line-height: 0.96;
      letter-spacing: -0.06em;
    }
    .copy {
      margin: 30px 0;
      display: grid;
      gap: 14px;
      color: #c8c8c8;
      line-height: 1.7;
    }
    .copy p { margin: 0; }
    a {
      display: inline-flex;
      max-width: 100%;
      padding: 14px 18px;
      border: 2px solid #f7f7f7;
      color: #0a0a0a;
      background: #f7f7f7;
      font-weight: 800;
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    a:hover, a:focus-visible {
      color: #f7f7f7;
      background: #ff365d;
      outline: 3px solid #71f7b0;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <p class="status">HTTP 200 · MIGRATION COMPLETE</p>
    <h1>SITE<br>MOVED.</h1>
    <div class="copy">
      <p>網站已搬遷，請由下方最新地址繼續瀏覽。</p>
      <p>サイトを移転しました。下記の新しいアドレスをご利用ください。</p>
      <p>This site has moved. Continue at the new address below.</p>
    </div>
    <a href="__MIGRATION_TARGET_URL__">__MIGRATION_TARGET_LABEL__</a>
  </main>
</body>
</html>
